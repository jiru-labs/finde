<!doctype html>
<!-- Imagen para compartir (og-es.png / og-en.png, 1200×630). Se fotografía con un navegador sin
     interfaz, sirviendo la raíz del repo: og.html?lang=es. Ver README, «Imagen para compartir». -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Barlow";src:url(../docs/fuentes/barlow-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Barlow Condensed";src:url(../docs/fuentes/barlow-condensed-700.woff2) format("woff2");font-weight:700}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#eef1f4;color:#13202e;font-family:"Barlow",sans-serif;display:grid;grid-template-columns:610px 590px}
.txt{padding:56px 20px 48px 64px;display:flex;flex-direction:column;justify-content:space-between}
.marca{display:flex;align-items:center;gap:12px;font:700 30px/1 "Barlow Condensed";letter-spacing:.04em}
.senal{display:inline-grid;place-items:center;width:44px;height:44px;background:#1d4f9c;color:#fff;border-radius:7px;box-shadow:inset 0 0 0 3px #1d4f9c,inset 0 0 0 5px #fff}
h1{font:700 64px/1.0 "Barlow Condensed";margin:0;letter-spacing:.005em}
p{font-size:25px;line-height:1.35;color:#566373;margin:0}
.url{font:700 26px/1 "Barlow Condensed";color:#1d4f9c;letter-spacing:.03em}
.mapa{background:#dfe8f1}
svg{width:590px;height:630px;display:block}
</style></head>
<body>
<div class="txt">
  <div class="marca"><span class="senal">F</span> Finde</div>
  <div><h1 id="h1"></h1></div>
  <p id="sub"></p>
  <div class="url">finde.jirulabs.com</div>
</div>
<div class="mapa"><svg id="m"></svg></div>
<script type="module">
const es = new URLSearchParams(location.search).get("lang") !== "en";
const D = await (await fetch("../docs/datos.json")).json();
document.getElementById("h1").textContent = es ? "Conoce casi toda España desde Madrid, un fin de semana cada vez" : "See most of Spain from Madrid, one weekend at a time";
document.getElementById("sub").textContent = es
  ? `${D.circuitos.length} rutas listas y ${D.catalogo_n} lugares, en coche o en tren. Sales el sábado, vuelves el domingo.`
  : `${D.circuitos.length} ready-made routes and ${D.catalogo_n} places, by car or by train. Leave on Saturday, home on Sunday.`;
// Península entera, con todas las rutas estándar de los circuitos; las de tren salen de su estación.
const vb = [15, -57, 585, 624];   // toda la península, de Baiona a Cadaqués (590×630, misma proporción)
let s = "";
for (const [iso, d] of Object.entries(D.mapa.paises))
  s += `<path d="${d}" fill="${iso === "ESP" ? "#f7f5ef" : "#ebe8df"}" stroke="#b9c3cd" stroke-width="1.2"/>`;
const vistos = new Set(); let lineas = "", trenes = "";
for (const c of D.circuitos) {
  const o = c.tren?.estacion ?? "Madrid", seq = [o, ...c.ciudades.filter(x => c.por_defecto.includes(x)), o];
  if (c.tren) {
    const [a, b] = D.ciudades.Madrid.xy, [x, y] = D.ciudades[o].xy;
    trenes += `<line x1="${a}" y1="${b}" x2="${x}" y2="${y}"/>`;
  }
  for (let i = 1; i < seq.length; i++) {
    if (seq[i - 1] === seq[i]) continue;
    const k = [seq[i - 1], seq[i]].sort().join("|");
    if (vistos.has(k)) continue; vistos.add(k);
    lineas += `<polyline points="${D.tramos[k].trazado.map(q => q.join(",")).join(" ")}"/>`;
  }
}
s += `<g stroke="#7a3e9d" stroke-width="3" stroke-dasharray="9 6" stroke-linecap="round">${trenes}</g>`;
s += `<g fill="none" stroke-linejoin="round" stroke-linecap="round"><g stroke="#fff" stroke-width="6">${lineas}</g><g stroke="#1d4f9c" stroke-width="3.2">${lineas}</g></g>`;
const ciudades = new Set(D.circuitos.flatMap(c => c.por_defecto));
for (const c of ciudades) { const [x, y] = D.ciudades[c].xy; s += `<circle cx="${x}" cy="${y}" r="5" fill="#1d4f9c" stroke="#fff" stroke-width="2"/>`; }
const [mx, my] = D.ciudades.Madrid.xy;
s += `<rect x="${mx - 8}" y="${my - 8}" width="16" height="16" fill="#13202e" transform="rotate(45 ${mx} ${my})"/>`;
s += `<text x="${mx + 14}" y="${my + 22}" font-family="Barlow Condensed" font-weight="700" font-size="24" fill="#13202e" paint-order="stroke" stroke="#f7f5ef" stroke-width="4">Madrid</text>`;
const m = document.getElementById("m");
m.setAttribute("viewBox", vb.join(" "));
m.setAttribute("preserveAspectRatio", "xMidYMid slice");
m.innerHTML = s;
document.body.dataset.listo = "1";
</script>
</body></html>
